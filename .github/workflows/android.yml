name: Android CI 3.2

on:
  push:
    branches: [ "3.2.0.4-ai3.0.3-nocheck-build" ]
  pull_request:
    branches: [ "3.2.0.4-ai3.0.3-nocheck-build" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle


    - name:  Generate Keystore File
      run: |
           # 1. 确保 keystore 目录存在（不存在则创建）
           rm -rf ./keystore/testkeystore.jks
           mkdir -p keystore
           
           # 1. 先把你的旧密钥库写出来
           echo "$KEY_STORE" | base64 -d > keystore/old_keystore.jks
        
           # 👇 关键一步：直接在 CI 里把旧密钥库强制转成兼容格式！
           keytool -importkeystore -srckeystore keystore/old_keystore.jks -destkeystore keystore/testkeystore.jks -deststoretype pkcs12 -srcstorepass "$KEY_STORE_PASSWORD" -deststorepass "$KEY_STORE_PASSWORD" -srcalias "$KEY_ALIAS" -destalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" -destkeypass "$KEY_PASSWORD" -noprompt
        
           # 验证一下
           ls -la keystore/
      env:
        KEY_STORE: ${{ secrets.KEYSTORE_FILE }}
        KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}  # 你需要在 GitHub Secrets 里加这个
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}                      # 你需要在 GitHub Secrets 里加这个
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}                # 你需要在 GitHub Secrets 里加这个

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: |
        export storePassword=${{ secrets.STORE_PASSWORD }}
        export keyAlias=${{ secrets.KEY_ALIAS }}
        export keyPassword=${{ secrets.KEY_PASSWORD }}
        export storeFile=${{ secrets.STORE_FILE }}
        ./gradlew assembleFullRelease
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aaps
        path: app/build/outputs/apk/full/release
